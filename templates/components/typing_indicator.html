{% macro typing_indicator_styles() %}
<style>
    /* Typing Indicator Component Styles */

    .typing-indicator {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0.75rem 1rem;
        background: var(--bg-secondary, #f5f5f5);
        border-radius: 8px;
        opacity: 0;
        transition: opacity 0.3s ease;
    }

    .typing-indicator-visible {
        opacity: 1;
    }

    .typing-dot {
        width: 8px;
        height: 8px;
        background: var(--primary-color, #007bff);
        border-radius: 50%;
        animation: typing-bounce 1.4s infinite ease-in-out both;
    }

    .typing-dot:nth-child(1) {
        animation-delay: -0.32s;
    }

    .typing-dot:nth-child(2) {
        animation-delay: -0.16s;
    }

    .typing-dot:nth-child(3) {
        animation-delay: 0s;
    }

    @keyframes typing-bounce {
        0%, 80%, 100% {
            transform: scale(0);
            opacity: 0.5;
        }
        40% {
            transform: scale(1);
            opacity: 1;
        }
    }

    .typing-text {
        margin-left: 0.5rem;
        font-size: 0.875rem;
        color: var(--text-muted, #6c757d);
        font-weight: 500;
    }

    /* Mobile responsive */
    @media (max-width: 768px) {
        .typing-indicator {
            padding: 0.5rem 0.75rem;
            font-size: 0.8125rem;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
        }

        .typing-text {
            font-size: 0.8125rem;
        }
    }

    /* Reduced motion support */
    @media (prefers-reduced-motion: reduce) {
        .typing-dot {
            animation: none;
            opacity: 1;
            transform: scale(1);
        }

        .typing-indicator {
            transition: opacity 0.1s;
        }
    }

    /* Dark mode support */
    [data-theme="dark"] .typing-indicator,
    @media (prefers-color-scheme: dark) {
        .typing-indicator {
            background: var(--bg-secondary-dark, #2d2d2d);
        }

        .typing-text {
            color: var(--text-muted-dark, #a0a0a0);
        }
    }
</style>
{% endmacro %}

{% macro typing_indicator_scripts() %}
<script>
    // TypingIndicator is included as ES module
    // Import in your main script:
    // import { TypingIndicator } from '/static/js/typing-indicator.js';

    // Global export is available for non-module usage
    if (typeof window.TypingIndicator === 'undefined') {
        console.warn('TypingIndicator not loaded. Include typing-indicator.js script.');
    }
</script>
{% endmacro %}

{% macro typing_indicator_container() %}
<!-- Typing indicator container will be dynamically managed by JavaScript -->
<div id="typing-indicator-container" role="status" aria-live="polite"></div>
{% endmacro %}
