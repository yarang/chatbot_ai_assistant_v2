{% macro streaming_styles() %}
<style>
    /* ========================================
       Chat Streaming Component Styles
       SPEC-STREAM-001: Real-time Chat Streaming
       ======================================== */

    /* CSS Variables for theming */
    :root {
        --primary-color: #007bff;
        --primary-hover: #0056b3;
        --success-color: #28a745;
        --danger-color: #dc3545;
        --warning-color: #ffc107;
        --info-color: #17a2b8;

        --bg-primary: #ffffff;
        --bg-secondary: #f5f5f5;
        --bg-hover: #e9ecef;

        --text-color: #333333;
        --text-muted: #6c757d;

        --border-color: #dee2e6;
        --radius-sm: 4px;
        --radius-md: 8px;
        --radius-lg: 12px;
        --radius-full: 9999px;

        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
        --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.1);
        --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.1);

        --spacing-xs: 0.25rem;
        --spacing-sm: 0.5rem;
        --spacing-md: 1rem;
        --spacing-lg: 1.5rem;
        --spacing-xl: 2rem;

        --transition-fast: 150ms ease-in-out;
        --transition-base: 300ms ease-in-out;
        --transition-slow: 500ms ease-in-out;
    }

    /* Dark mode support */
    [data-theme="dark"] {
        --bg-primary: #1a1a1a;
        --bg-secondary: #2d2d2d;
        --bg-hover: #3a3a3a;

        --text-color: #e0e0e0;
        --text-muted: #a0a0a0;

        --border-color: #404040;
    }

    /* ========================================
       Message Container
       ======================================== */
    .chat-messages {
        display: flex;
        flex-direction: column;
        gap: var(--spacing-md);
        padding: var(--spacing-md);
        overflow-y: auto;
        scroll-behavior: smooth;
    }

    /* ========================================
       Message Styles
       ======================================== */
    .message {
        max-width: 70%;
        padding: var(--spacing-md);
        border-radius: var(--radius-lg);
        position: relative;
        animation: message-fade-in var(--transition-base);
    }

    @keyframes message-fade-in {
        from {
            opacity: 0;
            transform: translateY(10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .message.user {
        align-self: flex-end;
        background: var(--primary-color);
        color: white;
        border-bottom-right-radius: var(--radius-sm);
    }

    .message.assistant {
        align-self: flex-start;
        background: var(--bg-secondary);
        color: var(--text-color);
        border: 1px solid var(--border-color);
        border-bottom-left-radius: var(--radius-sm);
    }

    .message.streaming {
        border-left: 3px solid var(--primary-color);
    }

    .message-content {
        line-height: 1.6;
        word-wrap: break-word;
    }

    /* ========================================
       Streaming Metadata
       ======================================== */
    .streaming-metadata {
        display: flex;
        align-items: center;
        gap: var(--spacing-sm);
        margin-top: var(--spacing-sm);
        padding-top: var(--spacing-sm);
        border-top: 1px solid var(--border-color);
        font-size: 0.75rem;
        color: var(--text-muted);
    }

    .streaming-metadata.compact {
        flex-wrap: wrap;
    }

    .streaming-metadata.detailed {
        flex-direction: column;
        align-items: flex-start;
    }

    .metadata-time {
        font-weight: 500;
    }

    /* ========================================
       Typing Indicator
       ======================================== */
    .typing-indicator {
        display: none;
        align-items: center;
        gap: 6px;
        padding: 0.75rem 1rem;
        background: var(--bg-secondary);
        border-radius: var(--radius-md);
        opacity: 0;
        transition: opacity var(--transition-base);
    }

    .typing-indicator-visible {
        opacity: 1;
    }

    .typing-dot {
        width: 8px;
        height: 8px;
        background: var(--primary-color);
        border-radius: 50%;
        animation: typing-bounce 1.4s infinite ease-in-out both;
    }

    .typing-dot:nth-child(1) {
        animation-delay: -0.32s;
    }

    .typing-dot:nth-child(2) {
        animation-delay: -0.16s;
    }

    .typing-dot:nth-child(3) {
        animation-delay: 0s;
    }

    @keyframes typing-bounce {
        0%, 80%, 100% {
            transform: scale(0);
            opacity: 0.5;
        }
        40% {
            transform: scale(1);
            opacity: 1;
        }
    }

    .typing-text {
        margin-left: 0.5rem;
        font-size: 0.875rem;
        color: var(--text-muted);
        font-weight: 500;
    }

    /* ========================================
       Scroll to Bottom Button
       ======================================== */
    .scroll-to-bottom {
        position: absolute;
        bottom: var(--spacing-md);
        right: var(--spacing-md);
        width: 40px;
        height: 40px;
        border-radius: var(--radius-full);
        background: var(--primary-color);
        color: white;
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: var(--shadow-md);
        opacity: 0;
        transform: translateY(10px);
        transition: all var(--transition-base);
    }

    .scroll-to-bottom.visible {
        opacity: 1;
        transform: translateY(0);
    }

    .scroll-to-bottom:hover {
        background: var(--primary-hover);
        transform: translateY(-2px);
    }

    /* ========================================
       Connection Status Indicator
       ======================================== */
    .connection-status {
        display: flex;
        align-items: center;
        gap: var(--spacing-sm);
        padding: var(--spacing-sm) var(--spacing-md);
        background: var(--bg-secondary);
        border-radius: var(--radius-full);
        font-size: 0.75rem;
        font-weight: 500;
    }

    .connection-status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        animation: pulse 2s infinite;
    }

    .connection-status.connected .connection-status-dot {
        background: var(--success-color);
    }

    .connection-status.connecting .connection-status-dot {
        background: var(--warning-color);
    }

    .connection-status.disconnected .connection-status-dot {
        background: var(--danger-color);
        animation: none;
    }

    @keyframes pulse {
        0%, 100% {
            opacity: 1;
        }
        50% {
            opacity: 0.5;
        }
    }

    /* ========================================
       Responsive Design
       ======================================== */
    @media (max-width: 768px) {
        .message {
            max-width: 85%;
        }

        .typing-indicator {
            padding: 0.5rem 0.75rem;
            font-size: 0.8125rem;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
        }

        .streaming-metadata {
            font-size: 0.6875rem;
        }
    }

    /* ========================================
       Accessibility
       ======================================== */
    @media (prefers-reduced-motion: reduce) {
        .message,
        .typing-indicator,
        .scroll-to-bottom,
        .connection-status-dot {
            animation: none !important;
            transition: none !important;
        }
    }

    /* Focus visible for keyboard navigation */
    *:focus-visible {
        outline: 2px solid var(--primary-color);
        outline-offset: 2px;
    }

    /* ========================================
       Utility Classes
       ======================================== */
    .hidden {
        display: none !important;
    }

    .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
    }
</style>
{% endmacro %}
